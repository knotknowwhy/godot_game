		<style>
:root {
	--target-size: 24px;
}

@media (pointer: coarse) {
	:root {
		--target-size: 44px;
	}
}

*, *::before, *::after {
	box-sizing: border-box;
}

html, body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	background-color: #08080a;
	color: #d8d8df;
	overflow: hidden;
	touch-action: none;
	user-select: none;
	-webkit-user-select: none;
	-webkit-touch-callout: none;
	font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

.sr-only {
	position: absolute;
	width: 1px;
	height: 1px;
	padding: 0;
	margin: -1px;
	overflow: hidden;
	clip-path: inset(50%);
	white-space: nowrap;
	border: 0;
}

#stage {
	position: relative;
	width: 100vw;
	height: 100dvh;
	background-color: #08080a;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	background-color: #08080a;
	image-rendering: crisp-edges;
	image-rendering: pixelated;
}

#canvas:focus {
	outline: none;
}

#fs-btn {
	position: fixed;
	top: max(10px, env(safe-area-inset-top, 0px));
	right: max(10px, env(safe-area-inset-right, 0px));
	z-index: 20;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	min-block-size: var(--target-size);
	min-inline-size: var(--target-size);
	gap: 6px;
	padding: 5px 10px;
	background-color: #111116;
	border: 1px solid #282830;
	border-radius: 2px;
	color: #b8b8c4;
	font-family: inherit;
	font-size: 11px;
	font-weight: 600;
	letter-spacing: 0.08em;
	line-height: 1;
	cursor: pointer;
	opacity: 0.45;
	transition: opacity 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

#rotate-hint {
	display: none;
	position: fixed;
	top: max(10px, env(safe-area-inset-top, 0px));
	left: max(10px, env(safe-area-inset-left, 0px));
	z-index: 19;
	padding: 6px 10px;
	background-color: #141210;
	border: 1px solid #483d22;
	border-radius: 2px;
	color: #d8c680;
	font-size: 10px;
	font-weight: 600;
	letter-spacing: 0.08em;
	pointer-events: none;
}

@media (orientation: portrait) and (pointer: coarse) {
	#rotate-hint {
		display: inline-block;
	}
}

#fs-btn:hover,
#fs-btn:focus-visible {
	opacity: 1;
	color: #f0f0f4;
	border-color: #4a4a58;
	outline: none;
}

#fs-btn:focus-visible {
	outline: 1px solid #c4a336;
	outline-offset: 2px;
}

#fs-btn[hidden] {
	display: none;
}

#status {
	position: fixed;
	inset: 0;
	z-index: 30;
	background-color: #08080a;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	padding: 24px;
	visibility: hidden;
}

#loader-box {
	width: min(320px, 100%);
	display: none;
	flex-direction: column;
	gap: 10px;
}

#loader-header {
	display: flex;
	justify-content: space-between;
	align-items: baseline;
	font-size: 11px;
	font-weight: 600;
	letter-spacing: 0.16em;
	color: #8c8c99;
}

#status-pct {
	color: #d8d8df;
	font-variant-numeric: tabular-nums;
}

#status-progress {
	appearance: none;
	border: 1px solid #26262e;
	background-color: #121218;
	border-radius: 2px;
	display: block;
	inline-size: 100%;
	block-size: 8px;
	overflow: clip;
	container-type: inline-size;
	--progress-bar-indeterminate-size: 30%;
	--progress-bar-indeterminate-animation-duration: 1.4s;
}

@media (prefers-reduced-motion: reduce) {
	#status-progress {
		--progress-bar-indeterminate-animation-duration: 10s;
	}
}

#status-progress:indeterminate {
	--progress-bar-animation: progress-bar-indeterminate var(--progress-bar-indeterminate-animation-duration) infinite linear;
}

#status-progress:dir(rtl):indeterminate {
	--progress-bar-animation: progress-bar-indeterminate var(--progress-bar-indeterminate-animation-duration) infinite linear reverse;
}

#status-progress::-webkit-progress-bar {
	background: transparent;
}

#status-progress::-webkit-progress-value {
	background-color: #b8332a;
	border-radius: 1px;
	transition: inline-size 0.1s linear;
	animation: var(--progress-bar-animation, revert-rule);
}

#status-progress::-moz-progress-bar {
	background-color: #b8332a;
	border-radius: 1px;
	transition: inline-size 0.1s linear;
	animation: var(--progress-bar-animation, revert-rule);
}

@keyframes progress-bar-indeterminate {
	from, to {
		inline-size: var(--progress-bar-indeterminate-size);
		margin-right: auto;
	}
	from {
		translate: -100%;
	}
	to {
		translate: 100cqi;
	}
}

#status-notice {
	display: none;
	max-width: min(440px, 100%);
	background-color: #1c1013;
	border: 1px solid #6b252f;
	border-radius: 2px;
	color: #e4d4d6;
	font-size: 12px;
	line-height: 1.5;
	padding: 14px 16px;
	text-align: center;
}

		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run this game are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					statusPct.textContent = Math.min(100, Math.round((current / total) * 100)) + '%';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					statusPct.textContent = '';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
